name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  image:
    name: Build and smoke-test image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --build-arg VERSION="$GITHUB_SHA" -t idp-app:ci .

      - name: Start container
        run: docker run -d --name idp-app -p 8888:8888 idp-app:ci

      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 --retry-all-errors \
            http://localhost:8888/health
          echo
          got=$(curl --fail --silent --show-error http://localhost:8888/version)
          echo "$got"
          echo "$got" | grep -q "$GITHUB_SHA"

      - name: Show container logs
        if: always()
        run: docker logs idp-app