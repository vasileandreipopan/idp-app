name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  image:
    name: Build, scan, test and publish image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --build-arg VERSION="$GITHUB_SHA" -t idp-app:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: idp-app:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Start container
        run: docker run -d --name idp-app -p 8888:8888 idp-app:ci

      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8888/health
          echo
          got=$(curl --fail --silent --show-error http://127.0.0.1:8888/version)
          echo "$got"
          echo "$got" | grep -q "$GITHUB_SHA"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"
          docker tag idp-app:ci "$image"
          docker push "$image"
          echo "Pushed $image"

      - name: Show container logs
        if: always()
        run: docker logs idp-app

